name: SDD Validation & Multi-Platform CI

on:
  push:
    branches: [ "desenvolvimento", "main" ]
  pull_request:
    branches: [ "desenvolvimento", "main" ]

jobs:
  validate-and-test:
    name: Build C++ & SDD Specs Check (x86_64 Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências de Sistema (OpenCV & Compilador C++)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopencv-dev pkg-config

      - name: Instalar Dependências Python (`pybind11` e `requirements.txt`)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pybind11
          pip install -r requirements.txt

      - name: Compilar Motor C++ (`miniola_cv.cpp`) em x86_64 via pybind11
        run: |
          python setup.py build_ext --inplace

      - name: Validar Especificações SDD (`scripts/check_specs.py`)
        run: |
          python scripts/check_specs.py

      - name: Executar Testes de Bancada e Visão (`tests/`)
        run: |
          python -m unittest discover -s tests -v
